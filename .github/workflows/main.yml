name: Build APK

on:
  workflow_dispatch:   # запуск вручну кнопкою "Run workflow" на вкладці Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build APK via docker-compose
        run: docker compose up --build

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: dist/**/*.apk