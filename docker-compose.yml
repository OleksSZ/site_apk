version: "3.9"

services:
  apk-builder:
    image: beevelop/cordova:latest   # містить Node + Java + Android SDK + Gradle
    working_dir: /app
    volumes:
      - ./:/app                      # весь проєкт (config.xml + www/)
      - ./dist:/app/platforms/android/app/build/outputs/apk
    entrypoint: >
      sh -c "
        cordova platform add android || true &&
        cordova build android --debug
      "