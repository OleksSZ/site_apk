version: "3.9"

services:
  apk-builder:
    image: beevelop/cordova:latest   # містить Node + Java + Android SDK + Gradle
    working_dir: /app
    volumes:
      - ./:/app                      # весь проєкт (config.xml + www/), dist/ з'явиться тут же
    entrypoint: >
      sh -c "
        set -e &&
        ( [ -f platforms/android/cordova/Api.js ] || cordova platform add android ) &&
        cordova build android --debug &&
        mkdir -p dist &&
        cp -r platforms/android/app/build/outputs/apk/. dist/
      "
